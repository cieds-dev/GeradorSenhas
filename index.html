<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Senha por regra – CIEDS</title>
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#16254a;--mute:#566386;--line:#d3dbec;--accent:#1f4296;--accent-hover:#16327a;--accent-ink:#fff;--yellow:#f6c614;--red:#d9342b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1630;--card:#16213f;--ink:#e8edfa;--mute:#a3b0d2;--line:#2b3a63;--accent:#7f9fe8;--accent-hover:#9db6f0;--accent-ink:#0b1430;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1630;--card:#16213f;--ink:#e8edfa;--mute:#a3b0d2;--line:#2b3a63;--accent:#7f9fe8;--accent-hover:#9db6f0;--accent-ink:#0b1430;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
.top{display:flex;align-items:center;gap:16px;background:#fff;color:#16254a;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 16px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--yellow) 0 33.3%,var(--red) 33.3% 66.6%,#1f4296 66.6% 100%)}
.logo{display:block;flex:none;width:auto;height:auto;max-width:96px;max-height:64px}
h1{font-size:1.5rem;line-height:1.2;margin:0 0 4px;color:#16254a}
p.sub{margin:0;color:#566386;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:12px;padding:18px}
label{font-weight:600;display:block;margin:0 0 6px}
input[type=text]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 18px}
.map div label{font-weight:400;text-align:center;margin:0 0 4px}
.map input{text-align:center;padding:8px 4px}
details{margin:14px 0 18px}
summary{cursor:pointer;color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--accent);background:var(--card);color:var(--accent);padding:8px 14px}
button.main{width:100%;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px}
button.main:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.out{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 10px 10px 14px;margin-top:16px}
code{font:1.15rem ui-monospace,Consolas,Menlo,monospace;overflow-wrap:anywhere;user-select:all}
.hint{color:var(--mute);font-size:.9rem;margin:10px 0 0}
@media (max-width:420px){.top{flex-direction:column;align-items:flex-start}.map{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main>
<header class="top">
<img class="logo" src="CIEDS.png" alt="CIEDS" onerror="this.style.display='none'">
<div>
<h1>Senha por regra</h1>
<p class="sub">Monta a senha do portal a partir do nome do portal e da regra definida pela TI.</p>
</div>
</header>
<div class="card">
  <label for="portal">Portal</label>
  <input id="portal" type="text" placeholder="producao.com.br" autocomplete="off" spellcheck="false">
  <details>
    <summary>Ajustar a regra</summary>
    <label for="sep" style="margin-top:12px">Símbolo após o nome</label>
    <input id="sep" type="text" value="@" maxlength="3" style="max-width:100px">
    <label style="margin-top:12px">Vogais e seus símbolos</label>
    <div class="map">
      <div><label for="va">A</label><input id="va" type="text" value="!" maxlength="2"></div>
      <div><label for="ve">E</label><input id="ve" type="text" value="#" maxlength="2"></div>
      <div><label for="vi">I</label><input id="vi" type="text" value="*" maxlength="2"></div>
      <div><label for="vo">O</label><input id="vo" type="text" value="(" maxlength="2"></div>
      <div><label for="vu">U</label><input id="vu" type="text" value="&amp;" maxlength="2"></div>
    </div>
  </details>
  <button class="main" id="gen">Gerar senha</button>
  <div class="out" id="out" hidden><code id="pw"></code><button id="cp">Copiar</button></div>
  <p class="hint" id="hint" aria-live="polite">Digite o endereço do portal, por exemplo producao.com.br.</p>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
function nomeDoPortal(t){
  let s=t.trim().toLowerCase().replace(/^[a-z]+:\/\//,"").replace(/^www\./,"").split(/[\/?#]/)[0].split(".")[0];
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
function gerar(){
  const nome=nomeDoPortal($("portal").value);
  if(!nome){$("out").hidden=true;$("hint").textContent="Digite o endereço do portal, por exemplo producao.com.br.";return}
  const m={a:$("va").value,e:$("ve").value,i:$("vi").value,o:$("vo").value,u:$("vu").value};
  const vogais=[...nome].filter(c=>m[c]!==undefined).map(c=>m[c]).join("");
  const senha=nome.charAt(0).toUpperCase()+nome.slice(1)+$("sep").value+vogais;
  $("pw").textContent=senha;$("out").hidden=false;
  $("hint").textContent=senha.length<12?"Esta senha tem "+senha.length+" caracteres. Alguns sistemas exigem um mínimo maior.":"";
}
function copiar(){
  const t=$("pw").textContent,b=$("cp");
  const ok=()=>{b.textContent="Copiado";setTimeout(()=>b.textContent="Copiar",1500)};
  const alt=()=>{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){b.textContent="Selecione e copie"}x.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,alt)}else alt();
}
$("gen").onclick=gerar;$("cp").onclick=copiar;
$("portal").addEventListener("keydown",e=>{if(e.key==="Enter")gerar()});
</script>
</body>
</html>
